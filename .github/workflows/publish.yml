name: Publish pipeline-helper image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (example: v1.0)"
        required: true
        default: "v1.0"
      dockerfile:
        description: "Dockerfile to build"
        required: true
        default: "Dockerfile.v1.0"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ujam-dev/pipeline-helper

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.cfg.outputs.version }}
      dockerfile: ${{ steps.cfg.outputs.dockerfile }}
      terraform: ${{ steps.cfg.outputs.terraform }}
      aws_prefix: ${{ steps.cfg.outputs.aws_prefix }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Derive build config
        id: cfg
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            DOCKERFILE="${{ github.event.inputs.dockerfile }}"
          else
            VERSION="${GITHUB_REF_NAME}"
            DOCKERFILE="Dockerfile.${VERSION}"
            if [[ ! -f "${DOCKERFILE}" ]]; then
              MAJOR_MINOR="$(echo "${VERSION}" | sed -E 's/^v([0-9]+\.[0-9]+).*/\1/')"
              DOCKERFILE="Dockerfile.${MAJOR_MINOR}"
            fi
          fi

          if [[ ! -f "${DOCKERFILE}" ]]; then
            echo "No Dockerfile found for ${VERSION}. Expected ${DOCKERFILE}."
            exit 1
          fi

          case "${DOCKERFILE}" in
            Dockerfile.v1.0)
              TERRAFORM="1.14.5"
              AWS_PREFIX="2.13."
              ;;
            Dockerfile.v2.0)
              TERRAFORM="1.15.0"
              AWS_PREFIX="2.15."
              ;;
            *)
              echo "Unknown Dockerfile for smoke-test assertions: ${DOCKERFILE}"
              exit 1
              ;;
          esac

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "terraform=${TERRAFORM}" >> "$GITHUB_OUTPUT"
          echo "aws_prefix=${AWS_PREFIX}" >> "$GITHUB_OUTPUT"

  smoke:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build test image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="publish-smoke-$(echo "${{ matrix.platform }}" | tr '/' '-')"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

          for attempt in 1 2 3; do
            if docker buildx build \
              --platform "${{ matrix.platform }}" \
              --file "${{ needs.prepare.outputs.dockerfile }}" \
              --tag "${IMAGE_TAG}" \
              --load \
              .; then
              break
            fi

            if [[ "${attempt}" -eq 3 ]]; then
              echo "Build failed after ${attempt} attempts"
              exit 1
            fi

            sleep "$((attempt * 15))"
          done

      - name: Assert tool versions
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm "${IMAGE_TAG}" sh -lc "node -v | grep -Eq '^v24\\.'"
          docker run --rm "${IMAGE_TAG}" sh -lc "terraform -version | head -n1 | grep -F 'Terraform v${{ needs.prepare.outputs.terraform }}'"
          docker run --rm "${IMAGE_TAG}" sh -lc "aws --version | grep -E 'aws-cli/${{ needs.prepare.outputs.aws_prefix }}[0-9]+'"
          docker run --rm "${IMAGE_TAG}" sh -lc "jq --version | grep -E '^jq-[0-9]+'"

  publish:
    needs:
      - prepare
      - smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(needs.prepare.outputs.version, 'v') }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ needs.prepare.outputs.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
